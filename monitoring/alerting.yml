    annotations:
      description: "Phase 6.1.5 of icloud-sovereign-backup. The Mac-Studio watcher daemon (`~/bin/icloud-reminders-cloudkit-watcher.py`, KeepAlive LaunchAgent) listens for `EKEventStoreChangedNotification` from EventKit and kicks the sync wrapper on a 10s debounce. It emits an `event=alive` heartbeat every 5 min as a liveness signal. Zero alive events in 30m (≥5 missed) means: the watcher process died and didn't respawn (TCC dropped, daemon crashed, KeepAlive disabled), the Mac Studio is offline/asleep, or Loki ingest is failing. The companion sync agent has a 6h `StartInterval` safety net so a dead watcher means lag of up to 6h, not zero sync. Check `launchctl list | grep icloud-reminders-cloudkit-watcher`, `tail /Users/USERNAME/Library/Logs/icloud-reminders-cloudkit-sync/watcher.stderr.log` (or `/tmp/watcher-test.log` if running outside launchd), and Mac Studio Tailscale connectivity to logs:3100. If `auth_blocked` events appear in Loki: System Settings → Privacy & Security → Reminders → add /usr/bin/python3 → ON. Runbook: roadmap/icloud-sovereign-backup/README.md (Phase 6.1.5)."
      summary: 'iCloud Reminders CloudKit watcher stale: zero alive heartbeats in 30 min'
    labels:
      sentinel: phase1
      severity: warning
    isPaused: false
    notification_settings: null
    record: null
