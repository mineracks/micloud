    annotations:
      description: "Phase 7 of icloud-sovereign-backup. iPhone Health Auto Export iOS app POSTs HealthKit deltas to https://health.example.com/ingest on its configured cadence (default Hourly). The FastAPI ingester on health-mirror VM (LAN_HOST / TAILNET_HOST) emits Loki heartbeats `{host=health-mirror, unit=health-ingest, event=accepted|rejected|started}` per POST. The 48h window is deliberate: iOS throttles Health Auto Export background refresh to roughly ONE POST/day, and that POST drifts ~1h later each day, so consecutive gaps routinely approach/exceed 24h (the prior 24h rule false-fired 2026-06-19 on a 24h47m drift gap; the earlier 6h rule false-fired nightly). The heartbeat plumbing is confirmed healthy — the ingester pushes `loki_push()` straight to Loki (`LOKI_URL` set, manual probe returned 204; 22 accepted events in the prior 7d). Zero `accepted` events in 48h means the iPhone-side automation has been demoted by iOS (typically after consecutive `Data caching did not complete successfully` failures), background app refresh is off, the bearer token was rotated server-side without updating iPhone, the URL has drifted (e.g. trailing whitespace — see memory cf_access_path_mismatch_silent_redirect), CF Tunnel is down, or the ingester has crashed. Diagnose by: (1) `ssh mineracks@health-mirror 'sudo docker compose ps'`, (2) CF Tunnel status via `cloudflared tunnel info 2a6442af-…`, (3) check newest row mtime in /data/archive.db, (4) Loki for any rejected events with reason= field, (5) iPhone Settings → General → Background App Refresh → Health Auto Export. Fix recipe in memory `phase7_health_streaming.md`. Runbook: applications/health-mirror/README.md."
      summary: 'Apple Health stream stale: zero accepted POSTs in 48 hours'
    labels:
      sentinel: phase1
      severity: warning
    isPaused: false
    notification_settings: null
    record: null
